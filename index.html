<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Güvenlik Paneli</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="login-container" class="container">
        <h2>Sisteme Giriş</h2>
        <input type="email" id="email" placeholder="E-posta" aria-label="E-posta" autocomplete="username" required>
        <input type="password" id="password" placeholder="Şifre" aria-label="Şifre" autocomplete="current-password" required>
        <button id="login-btn">Giriş Yap</button>
        <p id="error-message" style="color: red; display: none;"></p>
    </div>

    <div id="dashboard-container" style="display: none;">
        <div class="main-layout">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0;">Kontrol Paneli <span style="font-size:10px; color:#4caf50;">by @esofiso | 2026</span></h2>
                <button id="logout-btn" style="width: auto; padding: 8px 15px;">Çıkış</button>
            </div>

            <div class="tabs">
                <button id="tab-cam-btn" class="active-tab">📸 Kamera</button>
                <button id="tab-chat-btn" class="inactive-tab">💬 Sohbet</button>
            </div>

            <!-- KAMERA PANELİ -->
            <div id="camera-section" class="container">
                <div style="background: #0d1117; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <h4 style="margin-top: 0; color: #4caf50;">⚙️ Cihaz Ayarları</h4>
                    
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <label for="kamera-yonu-select">Ön/Arka Kamera:</label>
                        <select id="kamera-yonu-select" aria-label="Kamera Yönü" style="background: #21262d; color: white; border: 1px solid #30363d; border-radius: 4px;">
                            <option value="on">Ön Kamera</option>
                            <option value="arka">Arka Kamera</option>
                        </select>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <label for="oto-cekim-select">Çalışma Modu:</label>
                        <select id="oto-cekim-select" aria-label="Çalışma Modu" style="background: #21262d; color: white; border: 1px solid #30363d; border-radius: 4px;">
                            <option value="0">Sadece Web'den</option>
                            <option value="1">1 Saniyede Bir</option>
                            <option value="2">2 Saniyede Bir</option>
                            <option value="5">5 Saniyede Bir</option>
                            <option value="10">10 Saniyede Bir</option>
                            <option value="30">30 Saniyede Bir</option>
                            <option value="60">1 Dakikada Bir</option>
                            <option value="300">5 Dakikada Bir</option>
                            <option value="900">15 Dakikada Bir</option>
                        </select>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <label for="hareket-aktif-select">Hareket & Mail Uyarısı:</label>
                        <select id="hareket-aktif-select" aria-label="Hareket Uyarısı" style="background: #21262d; color: white; border: 1px solid #30363d; border-radius: 4px;">
                            <option value="true">AÇIK (Mail Atar)</option>
                            <option value="false">KAPALI (Sadece Çeker)</option>
                        </select>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="hassasiyet-slider">Hareket Hassasiyeti:</label>
                        <input type="range" id="hassasiyet-slider" aria-label="Hareket Hassasiyeti" min="5" max="50" value="15" style="width: 100px;">
                        <span id="hassasiyet-deger">%15</span>
                    </div>
                </div>

                <button id="capture-btn">Anlık Fotoğraf Çek</button>
                
                <div id="image-gallery">
                    <h3 id="foto-durum" style="color: #aaa;">Görüntü Bekleniyor...</h3>
                    <img id="main-image" src="" style="display: none; width: 100%; border-radius: 8px; margin-top: 15px;">
                    <p id="foto-zaman" style="color: #888; font-size: 12px;"></p>
                </div>

                <div class="slider-container" style="margin-top: 20px;">
                    <p>Geçmiş Fotoğraflar (Son 30)</p>
                    <input type="range" id="history-slider" aria-label="Geçmiş Slider" min="0" max="0" value="0" style="width: 100%;">
                </div>
            </div>

            <!-- CHAT PANELİ -->
            <div id="chat-section" class="container" style="display: none;">
                <h3 style="margin-top: 0;">Sohbet <span style="font-size:10px; color:#4caf50;">uçtan-uca şifreli</span></h3>
                <div id="chat-box" class="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Mesaj yaz..." aria-label="Mesaj Kutusu">
                    <button id="send-chat-btn">Gönder</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
